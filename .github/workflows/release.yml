name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != manifest v$VERSION"; exit 1; }

      - name: Build zip (manifest.json at the root)
        run: |
          mkdir -p dist
          zip -r "dist/d4te-${GITHUB_REF_NAME}.zip" . -x ".git/*" ".github/*" "dist/*" "release.sh" ".gitignore"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/d4te-${GITHUB_REF_NAME}.zip" \
            --title "d4te $GITHUB_REF_NAME" \
            --generate-notes
